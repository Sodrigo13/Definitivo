<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Notas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Gerenciador de Notas</h1>
    
    <div id="app">
        <input type="text" id="title" placeholder="Título da Nota">
        <textarea id="content" placeholder="Conteúdo"></textarea>
        <button onclick="createNote()">Adicionar Nota</button>

        <h2>Minhas Notas</h2>
        <ul id="notes-list"></ul>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
